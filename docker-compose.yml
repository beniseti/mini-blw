services:
  bocaditos:
    build: .
    image: bocaditos-blw:latest
    container_name: bocaditos-blw
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Datos de ejemplo: se insertan SOLO al crear la base de datos por primera vez.
      #   - Para probar en tu PC: "true"
      #   - En el NAS (uso real):  "false"
      SEED_DEMO_DATA: "true"
      TZ: Europe/Madrid
    volumes:
      # La base de datos SQLite (bocaditos.db) se guarda aquí y sobrevive a
      # reinicios y actualizaciones del contenedor.
      - bocaditos_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Proxy HTTPS opcional (necesario para instalar la PWA en el móvil desde un dominio).
  # Uso:  DOMAIN=bocaditos.midominio.com docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - bocaditos
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  bocaditos_data:
  caddy_data:
  caddy_config:
