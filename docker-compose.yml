services:
  bocaditos:
    build: .
    image: bocaditos-blw:latest
    container_name: bocaditos-blw
    ports:
      - "${PORT:-8080}:8080"
    # Configuración: crea un archivo .env (copia de .env.example). Sin .env se usan
    # los valores por defecto de abajo, pensados para probar en tu PC.
    environment:
      # Datos de ejemplo: se insertan SOLO al crear la base de datos por primera vez.
      # En el NAS pon SEED_DEMO_DATA=false en el .env.
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      # La base de datos SQLite (bocaditos.db) sobrevive a reinicios y actualizaciones.
      # Por defecto, en un volumen de Docker; con DATA_PATH=./data en el .env, en la
      # carpeta ./data (más fácil de incluir en las copias de seguridad del NAS).
      - ${DATA_PATH:-bocaditos_data}:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Proxy HTTPS opcional (necesario para instalar la PWA en el móvil desde un dominio).
  # Uso:  DOMAIN=bocaditos.midominio.com docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - bocaditos
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  bocaditos_data:
  caddy_data:
  caddy_config:
